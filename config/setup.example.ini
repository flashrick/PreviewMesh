# PreviewMesh setup / 安装配置
# The default command is an interactive wizard: bash scripts/setup.sh init
# Copy this commented template explicitly with: bash scripts/setup.sh init --template
# Edit the printed file, then: bash scripts/setup.sh install
# After install, preview the source workflow diff with:
# bash scripts/setup.sh onboard-source --config PATH --source OWNER/REPO
# Add --create-pr only when you want an interactive, reviewable onboarding PR.
# This command needs Python 3 and an authenticated gh CLI. A classic PAT used
# by gh auth login needs the repo and workflow scopes. It does not require
# systemd and never stores Token values here. A fine-grained PAT needs access
# to the target repository plus Contents, Workflows, and Pull requests
# read/write permissions.
# 默认命令会启动交互式向导：bash scripts/setup.sh init
# 只复制本模板请执行：bash scripts/setup.sh init --template
# 编辑生成的文件后再运行 install；不需要 export 环境变量。
# 安装结束后可先预览 source 工作流差异：
# bash scripts/setup.sh onboard-source --config PATH --source OWNER/REPO
# 只有需要创建可审核接入 PR 时才添加 --create-pr。
# 该命令需要 Python 3 和已登录 GitHub 的 gh CLI。classic PAT 需要 repo、
# workflow scope；不要求 systemd，也不会在此保存 Token。本命令使用
# fine-grained PAT 时，还需授予目标仓库访问权，以及 Contents、Workflows、
# Pull requests 的读写权限。
# Values are plain text, without quotes or shell expressions. Paths accept ~.
# 值不用引号，不支持 Shell 命令；路径支持 ~，相对路径以本配置所在目录为准。
# Token VALUES never belong here. Keep token files outside every Git checkout.
# 这里只填写 Token 文件路径，Token 本身保存在 Git 仓库之外。

[project]
# REQUIRED: new/existing Deployment management repository (private), OWNER/NAME.
# 必填：部署管理仓库（私有）的名称，不是应用源码仓库；现有仓库必须包含部署工具。
control_repository = YOUR_GITHUB_OWNER/previewmesh-control
# Deployment management local directory. Must differ from the public code directory and all application directories.
# 部署管理本地目录；必须与公开代码目录和所有应用代码目录分开。
control_directory = ~/workspace/previewmesh-control
# PreviewMesh code repository (public). Used only as the code source when a new private deployment management repository is created.
# PreviewMesh 代码仓库（公开）：仅在创建新的私有部署管理仓库时作为代码来源，通常不用修改。
public_repository = flashrick/PreviewMesh
# auto chooses Chinese for a Chinese locale; zh-CN or en selects explicitly.
# 输出语言：auto 跟随系统；中文选 zh-CN，英文选 en。
language = auto

[network]
# REQUIRED: private LAN IPv4. init asks for Ubuntu or WSL and detects the current platform by default.
# 必填：私有局域网 IPv4。init 会让你选择 Ubuntu 或 WSL，默认按当前平台自动检测。
# Ubuntu reads private global candidates from ip and filters known VPN/container interface prefixes; WSL reads preferred IPv4 from active physical
# Windows adapters through read-only PowerShell. The guest NAT address is never a LAN candidate.
# Ubuntu 会从 ip 读取私有 global 候选并过滤已知 VPN/容器接口前缀；WSL 通过只读 PowerShell 读取活动物理 Windows 网卡的可用 IPv4，
# 不会把 WSL guest NAT 地址当作局域网地址。
# One candidate is shown as the default; multiple candidates require a number or full address.
# If discovery fails or finds none, enter YOUR_LAN_IPV4 manually. Do not use 127.0.0.1 or a public address.
# 单个候选会显示为默认值；多个候选必须输入编号或完整地址。自动发现失败或没有候选时请手填
# YOUR_LAN_IPV4；不要填写 127.0.0.1、公网地址或 WSL 临时 NAT 地址。
# Windows manual fallback: Settings > Network & Internet > your connection > IPv4 address.
# Windows 手工回退：设置 > 网络和 Internet > 当前连接 > IPv4 地址。
# Ubuntu manual fallback: Settings > Network > connection details; check also lists candidates.
# Ubuntu 手工回退：设置 > 网络 > 连接详情；check 命令也会列出候选地址。
lan_ip = YOUR_LAN_IPV4
# Allowed client subnet. auto uses the network and prefix length of the interface owning lan_ip; it is not always /24.
# 允许访问的网段：auto 使用 lan_ip 所属网卡的实际网络和前缀长度，不固定为 /24；多网段环境请填写实际私有网段。
allowed_subnet = auto
# Links use <identity>.<lan_ip>.sslip.io:18080. External DNS must resolve this.
# 域名通过 sslip.io 自动解析；公司网络若拦截，安装检查会明确报错。
# Recommended: leave domain_suffix as auto. To use your own DNS suffix, replace
# it with your actual lowercase DNS suffix. See ops/install/access.md
# for wildcard DNS and the per-preview hosts-file alternative.
# 推荐保持 auto。若使用自有域名，请替换为实际的小写 DNS 后缀。通配 DNS 和每个预览的
# hosts 替代方案见 ops/install/access.md。
domain_suffix = auto
# 18080 is the browser entry port; source.port below is the APPLICATION port.
# 18080 是浏览器入口；下方 source 的 port 是应用内部监听端口，二者不同。

[credentials]
# Create tokens at the URLs/permission instructions printed during install.
# 按安装器展示的页面与权限创建 Token；缺少文件时可隐藏粘贴，自动保存到指定路径。
# Dispatch: fine-grained PAT selecting ONLY the deployment management repository; Actions: read/write; Metadata: read. The application workflow uses it to dispatch the deployment management workflow.
# 通知 Token：fine-grained PAT，仅选部署管理仓库；Actions：读写；Metadata：只读。应用工作流用它派发部署管理工作流。
dispatch_token_file = ~/.config/previewmesh/secrets/dispatch.token
# GHCR: classic PAT with read:packages; its owner must be able to read preview packages from the deployment management workflow.
# 拉取镜像 Token：classic PAT，read:packages；所属账号必须有镜像包的读取权限。
ghcr_token_file = ~/.config/previewmesh/secrets/ghcr.token

# Repeat a [source:unique-name] section for every application repository.
# 每个应用源码仓库复制一份 [source:唯一名称] 配置段；名称只用英文、数字、横线、下划线。
[source:app]
# REQUIRED: existing Application repository on GitHub, OWNER/NAME.
# 必填：存放应用代码和 Dockerfile 的现有 GitHub 应用源码仓库。
repository = YOUR_GITHUB_OWNER/your-application
# Application code local directory, or an absent directory the install command may clone into.
# 应用代码本地目录，或允许 install 命令 clone 到的新目录；install 不会提交或推送应用源码仓库。
directory = ~/workspace/your-application
# REQUIRED: actual HTTP listening port. Common values: 8080, 3000.
# 必填：应用实际 HTTP 监听端口，应用需监听 0.0.0.0；不是主机入口端口。
port = 8080
# One fine-grained PAT per application repository: Contents read; PRs and Commit statuses write.
# 每个应用源码仓库一个 fine-grained PAT：Contents 只读，Pull requests 与 Commit statuses 读写。
# Metadata read is included. Never share an application token between registrations.
# Metadata 为只读。不同应用源码仓库使用不同 Token 文件。
# The installer stores each application token in the private deployment management repository's matching Actions Secret.
# 安装器会把每个应用 Token 保存到私有部署管理仓库对应的 Actions Secret。
token_file = ~/.config/previewmesh/secrets/app.token
