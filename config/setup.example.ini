# PreviewMesh setup / 安装配置
# Copy with: bash scripts/setup.sh init
# Edit the printed file, then: bash scripts/setup.sh install
# 先复制模板并编辑，再运行 install；不需要 export 环境变量。
# Values are plain text, without quotes or shell expressions. Paths accept ~.
# 值不用引号，不支持 Shell 命令；路径支持 ~，相对路径以本配置所在目录为准。
# Token VALUES never belong here. Keep token files outside every Git checkout.
# 这里只填写 Token 文件路径，Token 本身保存在 Git 仓库之外。

[project]
# REQUIRED: new/existing PRIVATE control repository, OWNER/NAME.
# 必填：负责构建和部署的私有 control 仓库名称，不是应用仓库。
control_repository = YOUR_GITHUB_OWNER/previewmesh-control
# Local private checkout. Must differ from the public template and all sources.
# 私有 control 的本机目录；不能与公开模板或 source 目录重叠。
control_directory = ~/workspace/previewmesh-control
# Optional public template repository. Usually leave unchanged.
# 可选：公开模板仓库，通常不用修改。
public_repository = flashrick/PreviewMesh
# auto chooses Chinese for a Chinese locale; zh-CN or en selects explicitly.
# 输出语言：auto 跟随系统；中文选 zh-CN，英文选 en。
language = auto

[network]
# REQUIRED: stable LAN IPv4 of the Ubuntu server, or WINDOWS host for WSL.
# 必填：Ubuntu 服务器的固定局域网 IPv4；WSL 用户填写 Windows 的局域网 IP。
# Example: 192.168.1.20. Do not use 127.0.0.1 or WSL's temporary NAT address.
# 例：192.168.1.20，不要填写 127.0.0.1 或 WSL 的临时 NAT 地址。
# Windows: Settings > Network & Internet > your connection > IPv4 address.
# Windows：设置 > 网络和 Internet > 当前连接 > IPv4 地址。
# Ubuntu: Settings > Network > connection details. check also prints candidates.
# Ubuntu：设置 > 网络 > 连接详情。check 命令也会列出本机地址供参考。
lan_ip = YOUR_LAN_IPV4
# Allowed client subnet. auto uses the selected interface's local subnet.
# 允许访问的网段：auto 使用上述网卡所在网段。多网段环境可填如 192.168.1.0/24。
allowed_subnet = auto
# Links use <identity>.<lan_ip>.sslip.io:18080. External DNS must resolve this.
# 域名通过 sslip.io 自动解析；公司网络若拦截，安装检查会明确报错。
# 18080 is the browser entry port; source.port below is the APPLICATION port.
# 18080 是浏览器入口；下方 source 的 port 是应用内部监听端口，二者不同。

[credentials]
# Create tokens at the URLs/permission instructions printed during install.
# 按安装器展示的页面与权限创建 Token；缺少文件时可隐藏粘贴，自动保存到指定路径。
# Dispatch: fine-grained PAT selecting ONLY control; Actions read/write.
# 通知 Token：fine-grained PAT，仅选 control，Actions 读写，Metadata 只读。
dispatch_token_file = ~/.config/previewmesh/secrets/dispatch.token
# GHCR: classic PAT with read:packages; its owner must be able to read packages.
# 拉取镜像 Token：classic PAT，read:packages；所属账号必须有镜像包的读取权限。
ghcr_token_file = ~/.config/previewmesh/secrets/ghcr.token

# Repeat a [source:unique-name] section for every application.
# 每个应用复制一份 [source:唯一名称] 配置段；名称只用英文、数字、横线、下划线。
[source:app]
# REQUIRED: existing application repository on GitHub, OWNER/NAME.
# 必填：存放应用代码和 Dockerfile 的现有 GitHub source 仓库。
repository = YOUR_GITHUB_OWNER/your-application
# Existing source checkout, or an absent directory the installer may clone into.
# 已有 source 本机目录，或允许安装器 clone 到的新目录；不会提交或推送 source。
directory = ~/workspace/your-application
# REQUIRED: actual HTTP listening port. Common values: 8080, 3000.
# 必填：应用实际 HTTP 监听端口，应用需监听 0.0.0.0；不是主机入口端口。
port = 8080
# One fine-grained PAT per source: Contents read; PRs and Commit statuses write.
# 每个 source 一个 fine-grained PAT：Contents 只读，Pull requests 与 Commit statuses 读写。
# Metadata read is included. Never share a source token between registrations.
# Metadata 为只读。不同 source 使用不同 Token 文件。
token_file = ~/.config/previewmesh/secrets/app.token
