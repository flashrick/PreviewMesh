name: Notify PreviewMesh
on:
  pull_request_target:
    # synchronize fires whenever an existing PR receives a new head commit.
    types: [opened, synchronize, reopened, closed]
permissions: {}
jobs:
  notify:
    if: github.event.pull_request.head.repo.id == github.event.repository.id
    permissions:
      statuses: write
      issues: write
    runs-on: ubuntu-latest
    env:
      PREVIEWMESH_CONTROL_OWNER: YOUR_GITHUB_OWNER
      PREVIEWMESH_CONTROL_REPOSITORY: YOUR_CONTROL_REPOSITORY
    steps:
      # Publish an immediate status so dispatch and runner latency is visible to PR authors.
      - name: Report PreviewMesh request pending
        id: pending
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ github.token }}
          script: |
            const action = context.payload.action;
            const description = action === 'closed'
              ? 'Cleanup request sent; waiting for PreviewMesh to start'
              : 'Preview request sent; waiting for PreviewMesh to start';
            const targetUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state: 'pending',
              context: 'PreviewMesh',
              description,
              target_url: targetUrl
            });

            if (action === 'closed') {
              // Keep the close transition visible while the control workflow is queued.
              const marker = '<!-- previewmesh-cleanup-pending -->';
              const body = [
                marker,
                '### PreviewMesh deployment',
                '',
                '> [!NOTE]',
                '> Status: **pending**',
                '>',
                '> Preview cleanup is in progress. The preview URL may remain available briefly while the environment is removed.',
                '>',
                '> A final result will appear here after cleanup is confirmed.',
                '>',
                `> [Workflow run](<${targetUrl}>)`,
              ].join('\n');
              const issue = context.payload.pull_request.number;
              const existing = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue,
                per_page: 100,
              });
              const previous = (existing.data || []).find(comment =>
                comment.user?.type === 'Bot' && comment.body?.includes(marker));
              if (previous) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: previous.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue,
                  body,
                });
              }
            }

      # Metadata relay only. Never check out or execute source/PR code here.
      - name: Dispatch PreviewMesh lifecycle
        id: dispatch
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.PREVIEWMESH_DISPATCH_TOKEN }}
          script: |
            const owner = process.env.PREVIEWMESH_CONTROL_OWNER;
            const repo = process.env.PREVIEWMESH_CONTROL_REPOSITORY;
            if (!owner || !repo || owner.startsWith('YOUR_') || repo.startsWith('YOUR_')) {
              core.setFailed('Set PREVIEWMESH_CONTROL_OWNER and PREVIEWMESH_CONTROL_REPOSITORY first.');
              return;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner, repo,
              workflow_id: 'preview.yml', ref: 'main',
              inputs: {
                repository_id: String(context.payload.repository.id),
                source_repository: context.payload.repository.full_name,
                pr_number: String(context.payload.pull_request.number)
              }
            });

      # Give the author a terminal signal when dispatch itself could not start.
      - name: Report PreviewMesh dispatch failure
        if: steps.dispatch.outcome == 'failure'
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ github.token }}
          script: |
            const targetUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state: 'failure',
              context: 'PreviewMesh',
              description: 'PreviewMesh workflow could not be started',
              target_url: targetUrl
            });
