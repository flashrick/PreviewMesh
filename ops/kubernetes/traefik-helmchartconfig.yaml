# Keep Traefik internal; the WSL systemd proxy owns the host-facing port 18080.
# Publish loopback in each Ingress status so PreviewMesh can detect readiness.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    providers:
      kubernetesIngress:
        # A ClusterIP service has no external address to publish; use the explicit IP below.
        publishedService:
          enabled: false
        ingressEndpoint:
          ip: "127.0.0.1"
    service:
      spec:
        type: ClusterIP
