name: Update PreviewMesh from upstream

on:
  schedule:
    - cron: '17 2 * * 1'
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Upstream branch to check
        required: false
        default: main
        type: string

# This job only prepares a review PR on a hosted runner. It never uses the
# deployment runner or customer secrets.
permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    if: github.repository != 'flashrick/PreviewMesh'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UPSTREAM_REPOSITORY: ${{ vars.PREVIEWMESH_UPSTREAM_REPOSITORY || 'flashrick/PreviewMesh' }}
      UPSTREAM_REF: ${{ inputs.upstream_ref || 'main' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Prepare update branch
        id: update
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          scripts/update-upstream.sh \
            --remote upstream \
            --url "https://github.com/$UPSTREAM_REPOSITORY.git" \
            --ref "$UPSTREAM_REF"
      - name: Validate update
        if: steps.update.outputs.updated == 'true'
        run: |
          go test ./...
          go vet ./...
          python3 scripts/check-workflow.py
          python3 scripts/check-github-secrets.py
      - name: Push update branch
        if: steps.update.outputs.updated == 'true'
        env:
          UPDATE_BRANCH: ${{ steps.update.outputs.branch }}
        run: git push --set-upstream origin "$UPDATE_BRANCH"
      - name: Open update PR
        if: steps.update.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_BRANCH: ${{ steps.update.outputs.branch }}
        run: |
          gh pr create \
            --base main \
            --head "$UPDATE_BRANCH" \
            --title "chore: update PreviewMesh from upstream" \
            --body 'Review the upstream PreviewMesh changes before merging. Customer registry data remains local to this control repository.'
